name: Zbuduj Fakturnik.exe

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalacja zależności
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Testy
        run: python -m pytest -q

      - name: Numer wersji
        shell: bash
        run: |
          WERSJA="1.0.${{ github.run_number }}"
          echo "WERSJA=$WERSJA" >> "$GITHUB_ENV"
          printf '# Wpisywane automatycznie przy budowaniu.\nWERSJA = "%s"\n' "$WERSJA" > fakturnik/wersja.py

      - name: Metadane .exe (wydawca, wersja) dla antywirusów
        shell: bash
        run: |
          python skrypty/wersja_exe.py ${{ env.WERSJA }} > wersja_exe.txt
          python skrypty/wersja_exe.py ${{ env.WERSJA }} FakturnikPrzegladarka "Fakturnik - bezpieczna przegladarka" > wersja_przegladarki.txt

      - name: Budowanie .exe (Python spakowany do środka)
        run: >
          pyinstaller --noconfirm --onefile --windowed --name Fakturnik --noupx
          --exclude-module tkinter --exclude-module unittest
          --icon fakturnik/zasoby/ikona.ico
          --version-file wersja_exe.txt
          --exclude-module PySide6.QtWebEngineWidgets --exclude-module PySide6.QtWebEngineCore
          --exclude-module PySide6.QtWebChannel --exclude-module PySide6.QtQuick --exclude-module PySide6.QtQml
          --add-data "fakturnik/zasoby;fakturnik/zasoby"
          main.py

      - name: Budowanie przeglądarki (osobny plik, żeby główny program był mały)
        run: >
          pyinstaller --noconfirm --onefile --windowed --name FakturnikPrzegladarka --noupx
          --exclude-module tkinter --exclude-module unittest
          --icon fakturnik/zasoby/ikona.ico
          --version-file wersja_przegladarki.txt
          --add-data "fakturnik/zasoby;fakturnik/zasoby"
          przegladarka_main.py

      - name: Instalator (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc /Q "/DWersja=${{ env.WERSJA }}" instalator\Fakturnik.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Suma kontrolna SHA-256
        shell: bash
        run: |
          cd dist
          sha256sum Fakturnik.exe | cut -d' ' -f1 > Fakturnik.exe.sha256
          sha256sum FakturnikSetup.exe | cut -d' ' -f1 > FakturnikSetup.exe.sha256
          sha256sum FakturnikPrzegladarka.exe | cut -d' ' -f1 > FakturnikPrzegladarka.exe.sha256
          cat Fakturnik.exe.sha256 FakturnikSetup.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Fakturnik-${{ env.WERSJA }}
          path: |
            dist/Fakturnik.exe
            dist/Fakturnik.exe.sha256
            dist/FakturnikPrzegladarka.exe
            dist/FakturnikPrzegladarka.exe.sha256
            dist/FakturnikSetup.exe
            dist/FakturnikSetup.exe.sha256

      - name: Wydanie (z niego program pobiera aktualizacje)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.WERSJA }}
          target_commitish: ${{ github.sha }}
          name: Fakturnik ${{ env.WERSJA }}
          make_latest: true
          files: |
            dist/FakturnikSetup.exe
            dist/FakturnikSetup.exe.sha256
            dist/Fakturnik.exe
            dist/Fakturnik.exe.sha256
            dist/FakturnikPrzegladarka.exe
            dist/FakturnikPrzegladarka.exe.sha256
          body: |
            ${{ github.event.head_commit.message }}

            Pierwsza instalacja: pobierz FakturnikSetup.exe i uruchom (bez uprawnień administratora).
            Wersja przenośna: Fakturnik.exe. Program sam się aktualizuje; dane zostają.
